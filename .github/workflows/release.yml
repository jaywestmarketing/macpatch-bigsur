name: Build universal DMG

# Builds the universal (Intel + Apple Silicon) MacPatch DMG on every tagged
# release and uploads it as a downloadable release asset. Build once here,
# customers only download.

on:
  push:
    tags:
      - "v*"          # e.g. v1.0.0
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  build:
    runs-on: macos-14   # Apple-Silicon runner with full Xcode toolchain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swiftc --version
          xcrun --show-sdk-path

      - name: Build universal DMG
        run: |
          chmod +x build-dmg.sh patch-app.sh probe.sh
          ./build-dmg.sh

      - name: Verify universal binary
        run: |
          APP="dist/../.dmg-staging/MacPatch Dashboard.app"
          # The staging dir is cleaned by the trap; verify the DMG exists instead.
          test -f dist/MacPatch.dmg || { echo "DMG not produced"; exit 1; }
          hdiutil verify dist/MacPatch.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPatch-dmg
          path: dist/MacPatch.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacPatch.dmg
